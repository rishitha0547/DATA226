# Layer: STAGING
# Purpose: Validate the cleaned dataset coming from RAW.STOCK_PRICES.
# Tests:
#   • not_null – Ensures key columns (symbol, date, close) have valid data.
#   • unique_combination_of_columns (or singular test) – Enforces one record per symbol/date.
# Outcome:
#   Guarantees staging data is clean, deduplicated, and ready for transformation.

version: 2

models:
  - name: staging_stock_prices
    description: "Cleaned and standardized stock price data from RAW.STOCK_PRICES."
    columns:
      - name: symbol
        description: "Ticker symbol for the stock."
        tests:
          - not_null
      - name: date
        description: "Trading date."
        tests:
          - not_null
      - name: close
        description: "Daily closing price."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, date]


